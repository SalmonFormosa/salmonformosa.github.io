<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>WebAR 全螢幕相機 + GIF</title>

    <!-- 讓內容可延伸到瀏海區，避免底部留白 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- A-Frame / MindAR（1.2.5 版）-->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- GIF Shader（讓 GIF 真的動 & 透明）-->
    <script src="https://cdn.jsdelivr.net/gh/etiennepinchon/aframe-gif-shader@1.0.1/dist/aframe-gif-shader.min.js"></script>

    <style>
      /* 重要：整頁鋪滿 & 背景黑，避免相機未就緒時閃白 */
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
      }

      /* 關鍵：把 AR 畫面固定鋪滿整個安全視窗 */
      a-scene, canvas, .a-canvas {
        position: fixed !important;
        inset: 0 !important;            /* top:0; right:0; bottom:0; left:0 */
        width: 100vw !important;
        height: 100svh !important;      /* 行動裝置正確高度（含瀏海/工具列變化） */
        touch-action: none;
      }

      /* MindAR 內部的 <video> 若可見，確保鋪滿且不變形 */
      video, video[playsinline] {
        object-fit: cover !important;
      }

      /* 角位移安全區（iOS 瀏海區） */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      /* 簡易除錯訊息（可刪） */
      #debug {
        position: fixed;
        top: 10px; left: 10px;
        background: rgba(0,0,0,.55);
        color: #0f0;
        padding: 8px 12px;
        font: 13px/1.4 monospace;
        border-radius: 8px;
        z-index: 9999;
        max-width: 80vw;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="debug">⏳ 初始化中...</div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
      embedded
      renderer="alpha: true; antialias: true; colorManagement: true; physicallyCorrectLights: true; precision: mediump"
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
    >
      <!-- 你的 GIF（建議本身要是透明背景 GIF） -->
      <a-assets timeout="30000">
        <img id="gif1" src="./drawing1.gif" crossorigin="anonymous" />
        <img id="gif2" src="./drawing2.gif" crossorigin="anonymous" />
        <img id="gif3" src="./drawing3.gif" crossorigin="anonymous" />
        <img id="gif4" src="./drawing4.gif" crossorigin="anonymous" />
        <img id="gif5" src="./drawing5.gif" crossorigin="anonymous" />
      </a-assets>

      <!-- 五個目標：使用 gif shader；透明、雙面，alphaTest 去除邊緣殘影 -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane id="p1" position="0 0 0" width="1" height="1"
          material="shader:gif; src:#gif1; transparent:true; side:double; alphaTest:0.001"
          visible="false"></a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1">
        <a-plane id="p2" position="0 0 0" width="1" height="1"
          material="shader:gif; src:#gif2; transparent:true; side:double; alphaTest:0.001"
          visible="false"></a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
        <a-plane id="p3" position="0 0 0" width="1" height="1"
          material="shader:gif; src:#gif3; transparent:true; side:double; alphaTest:0.001"
          visible="false"></a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 3">
        <a-plane id="p4" position="0 0 0" width="1" height="1"
          material="shader:gif; src:#gif4; transparent:true; side:double; alphaTest:0.001"
          visible="false"></a-plane>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 4">
        <a-plane id="p5" position="0 0 0" width="1" height="1"
          material="shader:gif; src:#gif5; transparent:true; side:double; alphaTest:0.001"
          visible="false"></a-plane>
      </a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      const dbg = document.getElementById("debug");
      const log = (m) => { console.log(m); dbg.textContent = m; };

      const sceneEl = document.querySelector("a-scene");

      // 基本事件
      sceneEl.addEventListener("loaded", () => log("✅ A-Frame 已載入，等待 MindAR..."));
      sceneEl.addEventListener("arReady", () => log("🚀 MindAR 已啟動，請對準圖片"));
      sceneEl.addEventListener("arError", (e) => log("❌ MindAR 初始化失敗：" + JSON.stringify(e)));

      // 目標偵測：找到就顯示 GIF，離開就隱藏
      const pairs = [
        {targetIndex:0, planeId:"p1", img:"#gif1"},
        {targetIndex:1, planeId:"p2", img:"#gif2"},
        {targetIndex:2, planeId:"p3", img:"#gif3"},
        {targetIndex:3, planeId:"p4", img:"#gif4"},
        {targetIndex:4, planeId:"p5", img:"#gif5"},
      ];

      // 讓平面尺寸自動依照 GIF 比例（避免被拉扁/拉長）
      function fitPlaneToImage(planeEl, imgEl, baseHeight = 1) {
        const setSize = () => {
          if (!imgEl.naturalWidth || !imgEl.naturalHeight) return;
          const aspect = imgEl.naturalWidth / imgEl.naturalHeight;
          planeEl.setAttribute("height", baseHeight);
          planeEl.setAttribute("width", baseHeight * aspect);
        };
        if (imgEl.complete) setSize();
        else imgEl.addEventListener("load", setSize, { once:true });
      }

      pairs.forEach(({targetIndex, planeId, img}) => {
        const targetEl = document.querySelector(`[mindar-image-target="targetIndex: ${targetIndex}"]`);
        const planeEl  = document.getElementById(planeId);
        const imgEl    = document.querySelector(img);

        // 自動調整平面尺寸符合 GIF 比例
        fitPlaneToImage(planeEl, imgEl);

        const restartGif = () => {
          // 重新指定材質觸發 shader 重建（等同重播）
          planeEl.setAttribute("material", `shader:gif; src:${img}; transparent:true; side:double; alphaTest:0.001`);
        };

        targetEl.addEventListener("targetFound", () => {
          log(`🎯 偵測到目標 #${targetIndex + 1}`);
          restartGif();
          planeEl.setAttribute("visible", "true");
        });

        targetEl.addEventListener("targetLost", () => {
          log(`👋 失去目標 #${targetIndex + 1}`);
          planeEl.setAttribute("visible", "false");
        });
      });

      // 檢查 targets.mind 可讀
      fetch("./targets.mind")
        .then(r => r.ok ? log("📦 已載入 targets.mind") : log("⚠️ 無法載入 targets.mind（檔名/路徑）"))
        .catch(() => log("❌ 讀取 targets.mind 失敗（請確認部署）"));
    </script>
  </body>
</html>
