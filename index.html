<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>WebAR 全螢幕相機 + GIF（自動偵測路徑版）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- A-Frame / MindAR（1.2.5） -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- GIF Shader -->
    <script src="https://cdn.jsdelivr.net/gh/etiennepinchon/aframe-gif-shader@1.0.1/dist/aframe-gif-shader.min.js"></script>

    <style>
      html, body { height:100%; margin:0; background:#000; overflow:hidden; }
      /* 全螢幕鋪滿，解決底部白塊 */
      a-scene, canvas, .a-canvas {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100svh !important;
        touch-action: none;
      }
      video, video[playsinline] { object-fit: cover !important; }
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* 載入/診斷 UI */
      #overlay {
        position: fixed; inset: 0; display:flex; flex-direction:column;
        align-items:center; justify-content:center; background:rgba(0,0,0,.85);
        color:#fff; z-index:9999; text-align:center; padding:24px;
      }
      #status { margin-top:12px; font:14px/1.6 monospace; color:#cfe9ff; white-space:pre-wrap; text-align:left; max-width:92vw; }
      #startBtn, #retryBtn {
        margin-top:16px; padding:12px 18px; font-size:16px; border:none; border-radius:10px; cursor:pointer;
      }
      #startBtn { background:#2e7d32; color:#fff; }
      #retryBtn { background:#c62828; color:#fff; display:none; }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h2>📱 WebAR 載入中</h2>
      <div>請確認相機權限，然後點「開始體驗」</div>
      <button id="startBtn">開始體驗</button>
      <button id="retryBtn">重新整理</button>
      <pre id="status">初始化…</pre>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
      embedded
      renderer="alpha:true; antialias:true; colorManagement:true; physicallyCorrectLights:true; precision: mediump"
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
    >
      <!-- 先不直接給 src；改由 JS 自動偵測能載入的實際路徑 -->
      <a-assets timeout="30000" id="assets">
        <img id="gif1" crossorigin="anonymous" data-basenames='["./assets/anim1.gif","/assets/anim1.gif","./anim1.gif"]'>
        <img id="gif2" crossorigin="anonymous" data-basenames='["./assets/anim2.gif","/assets/anim2.gif","./anim2.gif"]'>
        <img id="gif3" crossorigin="anonymous" data-basenames='["./assets/anim3.gif","/assets/anim3.gif","./anim3.gif"]'>
        <img id="gif4" crossorigin="anonymous" data-basenames='["./assets/anim4.gif","/assets/anim4.gif","./anim4.gif"]'>
        <img id="gif5" crossorigin="anonymous" data-basenames='["./assets/anim5.gif","/assets/anim5.gif","./anim5.gif"]'>
      </a-assets>

      <!-- 5 個目標：gif shader、透明、雙面、alphaTest 去邊緣鋸齒 -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane id="p1" position="0 0 0" width="1" height="1"
          material="shader:gif; src:#gif1; transparent:true; side:double; alphaTest:0.001"
          visible="false"></a-plane>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 1">
        <a-plane id="p2" position="0 0 0" width="1" height="1"
          material="shader:gif; src:#gif2; transparent:true; side:double; alphaTest:0.001"
          visible="false"></a-plane>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 2">
        <a-plane id="p3" position="0 0 0" width="1" height="1"
          material="shader:gif; src:#gif3; transparent:true; side:double; alphaTest:0.001"
          visible="false"></a-plane>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 3">
        <a-plane id="p4" position="0 0 0" width="1" height="1"
          material="shader:gif; src:#gif4; transparent:true; side:double; alphaTest:0.001"
          visible="false"></a-plane>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 4">
        <a-plane id="p5" position="0 0 0" width="1" height="1"
          material="shader:gif; src:#gif5; transparent:true; side:double; alphaTest:0.001"
          visible="false"></a-plane>
      </a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      const $ = (q)=>document.querySelector(q);
      const statusEl = $('#status');
      const overlay  = $('#overlay');
      const startBtn = $('#startBtn');
      const retryBtn = $('#retryBtn');
      const sceneEl  = document.querySelector('a-scene');

      const log = (m) => { console.log(m); statusEl.textContent += "\\n" + m; };

      // 依序嘗試多個候選路徑，回傳第一個成功的 URL
      function tryPaths(paths) {
        return new Promise((resolve, reject) => {
          let idx = 0;
          const tryNext = () => {
            if (idx >= paths.length) { reject(new Error('all paths failed')); return; }
            const url = paths[idx++];
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload  = () => resolve(url);
            img.onerror = () => { log(`❌ 圖片載入失敗：${url}`); tryNext(); };
            img.src = url;
          };
          tryNext();
        });
      }

      // 初始化資源路徑
      async function initAssetPaths() {
        const imgs = Array.from(document.querySelectorAll('#assets img'));
        log(`等待圖片載入 0/${imgs.length}`);
        let ok = 0;
        for (const el of imgs) {
          const candidates = JSON.parse(el.getAttribute('data-basenames'));
          try {
            const okUrl = await tryPaths(candidates);
            el.setAttribute('src', okUrl); // 實際設定 src 給 a-assets
            ok++;
            log(`✅ 取得圖片路徑：${okUrl}（進度 ${ok}/${imgs.length}）`);
          } catch {
            log('⚠️ 這張圖所有候選路徑都失敗，請檢查檔名/大小寫/LFS：' + candidates.join(' , '));
          }
        }
      }

      // 檢查 targets.mind
      fetch('./targets.mind')
        .then(r => r.ok ? log('📦 已載入 targets.mind') : log('⚠️ 無法載入 targets.mind（檔名/路徑）'))
        .catch(()=>log('❌ 讀取 targets.mind 失敗（請確認部署）'));

      // A-Frame / MindAR 事件
      sceneEl.addEventListener('loaded', ()=>log('✅ A-Frame 已載入'));
      sceneEl.addEventListener('arReady', ()=>{ log('🚀 MindAR 已啟動'); overlay.style.display='none'; });
      sceneEl.addEventListener('arError', (e)=>{ log('❌ AR 初始化失敗：'+JSON.stringify(e)); retryBtn.style.display='inline-block'; });
      sceneEl.addEventListener('camera-init', ()=>log('📷 camera-init'));
      sceneEl.addEventListener('camera-error', (e)=>{ log('❌ camera-error：'+JSON.stringify(e.detail||e)); retryBtn.style.display='inline-block'; });

      // 自動依 GIF 比例調整平面尺寸
      function fitPlaneToImage(planeEl, imgEl, baseH=1){
        const setSize = ()=>{
          if (!imgEl.naturalWidth || !imgEl.naturalHeight) return;
          const aspect = imgEl.naturalWidth / imgEl.naturalHeight;
          planeEl.setAttribute('height', baseH);
          planeEl.setAttribute('width',  baseH*aspect);
        };
        if (imgEl.complete) setSize(); else imgEl.addEventListener('load', setSize, {once:true});
      }

      const pairs = [
        {idx:0, p:'#p1', i:'#gif1'},
        {idx:1, p:'#p2', i:'#gif2'},
        {idx:2, p:'#p3', i:'#gif3'},
        {idx:3, p:'#p4', i:'#gif4'},
        {idx:4, p:'#p5', i:'#gif5'},
      ];

      pairs.forEach(({idx,p,i})=>{
        const target = document.querySelector(`[mindar-image-target="targetIndex: ${idx}"]`);
        const plane  = document.querySelector(p);
        const img    = document.querySelector(i);

        fitPlaneToImage(plane, img);

        const restartGif = ()=>{
          plane.setAttribute('material', `shader:gif; src:${i}; transparent:true; side:double; alphaTest:0.001`);
        };

        target.addEventListener('targetFound', ()=>{
          log(`🎯 偵測到目標 #${idx+1}`);
          restartGif();
          plane.setAttribute('visible','true');
        });
        target.addEventListener('targetLost', ()=>{
          log(`👋 失去目標 #${idx+1}`);
          plane.setAttribute('visible','false');
        });
      });

      // 手動啟動（新版 API）
      startBtn.addEventListener('click', ()=>{
        try{
          log('👉 嘗試啟動 AR（mindar-image-system.start）');
          sceneEl.systems['mindar-image-system'].start();
        }catch(e){
          log('❌ 啟動呼叫失敗：'+(e.message||e));
          retryBtn.style.display='inline-block';
        }
      });
      retryBtn.addEventListener('click', ()=>location.reload());

      // ---- 啟動前先初始化圖片實際路徑 ----
      initAssetPaths();
    </script>
  </body>
</html>
