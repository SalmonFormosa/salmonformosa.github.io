<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MindAR 相機測試</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/aframe/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }

      #loadingScreen {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: black; color: white;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999;
      }
      #statusText { margin-top: 15px; font-size: 14px; color: #aaa; }
      #startBtn, #retryBtn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }
      #retryBtn { display: none; }
    </style>
  </head>
  <body>
    <!-- Loading 畫面 -->
    <div id="loadingScreen">
      <div id="mainMessage">📂 載入中...</div>
      <div id="statusText">正在載入 targets.mind</div>
      <button id="startBtn">▶️ 開始體驗</button>
      <button id="retryBtn">🔄 重試</button>
    </div>

    <!-- A-Frame 場景 -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
      embedded
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane color="blue" height="1" width="1" position="0 0 0"></a-plane>
      </a-entity>
    </a-scene>

    <script>
  const sceneEl = document.querySelector("a-scene");
  const startBtn = document.getElementById("startBtn");
  const retryBtn = document.getElementById("retryBtn");

  function updateStatus(message, subMessage = "") {
    document.getElementById("mainMessage").innerText = message;
    document.getElementById("statusText").innerText = subMessage;
  }

  // 確保 scene 載入完成後再存取 mindar-image
  sceneEl.addEventListener("loaded", () => {
    console.log("✅ A-Frame 場景已載入");

    const mindarComponent = sceneEl.components["mindar-image"];
    if (!mindarComponent) {
      console.error("⚠️ mindar-image 元件尚未初始化");
      updateStatus("⚠️ 初始化失敗", "mindar-image 未就緒");
      return;
    }

    // 綁定開始按鈕
    startBtn.addEventListener("click", async () => {
      console.log("▶️ 開始體驗被點擊");
      updateStatus("🚀 啟動中...", "請允許使用相機");

      try {
        await mindarComponent.start();  // 啟動 AR
        console.log("🎉 MindAR 啟動成功");
        updateStatus("🎉 AR 已啟動", "相機已打開");
        document.getElementById("loadingScreen").style.display = "none";
      } catch (err) {
        console.error("❌ MindAR 啟動失敗", err);
        updateStatus("❌ 啟動失敗", "請確認瀏覽器支援與權限");
        retryBtn.style.display = "inline-block";
      }
    });

    // 綁定重試按鈕
    retryBtn.addEventListener("click", async () => {
      console.log("🔄 重新嘗試啟動");
      updateStatus("🚀 重新啟動中...", "請允許使用相機");

      try {
        await mindarComponent.start();
        console.log("🎉 MindAR 重新啟動成功");
        updateStatus("🎉 AR 已啟動", "相機已打開");
        document.getElementById("loadingScreen").style.display = "none";
      } catch (err) {
        console.error("❌ 重新啟動失敗", err);
        updateStatus("❌ 啟動失敗", "請檢查相機權限或瀏覽器");
      }
    });
  });
</script>

  </body>
</html>
