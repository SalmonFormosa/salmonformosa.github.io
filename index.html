<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MindAR WebAR — Debug & Start Flow</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #loadingScreen {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: black; color: white;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      font-family: sans-serif;
    }
    #statusText { margin-top: 12px; font-size: 16px; color: #ddd; }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      background: #333; color: white;
      border: none; border-radius: 5px;
      cursor: pointer;
    }
    #retryBtn { display: none; background: darkred; }
  </style>
</head>
<body>
  <div id="loadingScreen">
    <div id="mainMessage">📂 載入中...</div>
    <div id="statusText">正在載入 targets.mind</div>
    <button id="startBtn">▶️ 開始體驗</button>
    <button id="retryBtn">🔄 重試</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
    embedded
    color-space="sRGB"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane color="blue" height="1" width="1" position="0 0 0"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const msg = document.getElementById("mainMessage");
    const stat = document.getElementById("statusText");
    const startBtn = document.getElementById("startBtn");
    const retryBtn = document.getElementById("retryBtn");
    const sceneEl = document.querySelector("a-scene");

    function updateStatus(m, s="") {
      msg.innerText = m;
      stat.innerText = s;
      console.log("Status:", m, s);
    }

    // 檢查 targets.mind
    fetch("./targets.mind").then(res => {
      res.ok ? updateStatus("✅ 已載入 targets.mind", "請按「開始體驗」") :
                updateStatus("⚠️ 無法載入 targets.mind", "請確認檔案存在");
    }).catch(() => {
      updateStatus("❌ 載入 targets.mind 失敗", "請檢查路徑");
    });

    sceneEl.addEventListener("loaded", () => {
      console.log("A-Frame scene loaded");
    });

    sceneEl.addEventListener("camera-init", () => {
      updateStatus("📷 相機已啟動", "等待 AR 引擎準備");
    });

    sceneEl.addEventListener("camera-error", (e) => {
      console.error("Camera error", e.detail);
      updateStatus("❌ 相機無法啟動", "請檢查權限或瀏覽器設定");
      retryBtn.style.display = "inline-block";
    });

    sceneEl.addEventListener("arReady", () => {
      updateStatus("🎉 AR 已啟動完成", "請將鏡頭指向目標");
      setTimeout(() => document.getElementById("loadingScreen").style.display = "none", 1000);
    });

    sceneEl.addEventListener("arError", (err) => {
      console.error("AR initialization error", err);
      updateStatus("⚠️ AR 初始化失敗", err.detail || err.message);
      retryBtn.style.display = "inline-block";
    });

    sceneEl.addEventListener("loaded", () => {
      const comp = sceneEl.components["mindar-image"];
      if (!comp) {
        console.error("mindar-image component not ready");
        updateStatus("⚠️ 元件未初始化", "請稍後重試");
        retryBtn.style.display = "inline-block";
      }
    });

    startBtn.addEventListener("click", async () => {
      updateStatus("🚀 啟動中...", "請允許相機");
      const comp = sceneEl.components["mindar-image"];
      if (!comp) {
        updateStatus("⚠️ 無法啟動", "mindar-image 未就緒");
        return;
      }
      try {
        await comp.start();
        console.log("MindAR start success");
      } catch (err) {
        console.error("MindAR start failed:", err);
        updateStatus("❌ MindAR 啟動失敗", err.message || err);
        retryBtn.style.display = "inline-block";
      }
    });

    retryBtn.addEventListener("click", () => window.location.reload());
  </script>
</body>
</html>
