<script>
  window.addEventListener('DOMContentLoaded', () => {
    const $ = (q)=>document.querySelector(q);
    const statusEl = $('#status');
    const overlay  = $('#overlay');
    const startBtn = $('#startBtn');
    const retryBtn = $('#retryBtn');
    const sceneEl  = document.querySelector('a-scene');

    const log = (m) => { console.log(m); statusEl.textContent += "\n" + m; };

    // === 診斷事件 ===
    sceneEl.addEventListener('loaded', ()=>log('✅ A-Frame 已載入'));
    sceneEl.addEventListener('camera-init', ()=>log('📷 camera-init'));
    sceneEl.addEventListener('camera-error', (e)=>{ log('❌ camera-error：'+JSON.stringify(e.detail||e)); retryBtn.style.display='inline-block'; });
    sceneEl.addEventListener('arReady', ()=>{ log('🚀 MindAR 已啟動'); overlay.style.display='none'; });
    sceneEl.addEventListener('arError',  (e)=>{ log('❌ AR 初始化失敗：'+JSON.stringify(e)); retryBtn.style.display='inline-block'; });

    // GIF 比例
    function fitPlaneToImage(planeEl, imgEl, baseH=1){
      const setSize = ()=>{
        if (!imgEl.naturalWidth || !imgEl.naturalHeight) return;
        const aspect = imgEl.naturalWidth / imgEl.naturalHeight;
        planeEl.setAttribute('height', baseH);
        planeEl.setAttribute('width',  baseH*aspect);
      };
      if (imgEl.complete) setSize(); else imgEl.addEventListener('load', setSize, {once:true});
    }
    [['#p1','#gif1'],['#p2','#gif2'],['#p3','#gif3'],['#p4','#gif4'],['#p5','#gif5']]
      .forEach(([p,i])=>fitPlaneToImage($(p), $(i)));

    // 目標顯示/隱藏
    ;[0,1,2,3,4].forEach(idx=>{
      const target = document.querySelector(`[mindar-image-target="targetIndex: ${idx}"]`);
      const plane  = $('#p'+(idx+1));
      const imgSel = '#gif'+(idx+1);
      const restartGif = ()=>plane.setAttribute('material', `shader:gif; src:${imgSel}; transparent:true; side:double; alphaTest:0.001`);
      target.addEventListener('targetFound', ()=>{ log(`🎯 偵測到目標 #${idx+1}`); restartGif(); plane.setAttribute('visible','true'); });
      target.addEventListener('targetLost',  ()=>{ log(`👋 失去目標 #${idx+1}`); plane.setAttribute('visible','false'); });
    });

    // 讀取 targets.mind（診斷）
    fetch('./targets.mind')
      .then(r => r.ok ? log('📦 已載入 targets.mind') : log('⚠️ 無法載入 targets.mind（檔名/路徑）'))
      .catch(()=>log('❌ 讀取 targets.mind 失敗（請確認部署）'));

    // === 等待 renderer 就緒：多事件備援 + 超時保險 ===
    function waitRendererReady(timeoutMs = 4000){
      return new Promise((resolve)=>{
        let resolved = false;
        const done = (tag)=>{ if (!resolved){ resolved = true; log(`🟢 renderer ready via ${tag}`); resolve(); } };
        const onRendererInit = ()=>done('rendererinitialized');
        const onRenderStart  = ()=>done('renderstart');
        const onLoaded       = ()=>done('loaded-fallback');

        sceneEl.addEventListener('rendererinitialized', onRendererInit, {once:true});
        sceneEl.addEventListener('renderstart',        onRenderStart,  {once:true});
        sceneEl.addEventListener('loaded',             onLoaded,       {once:true});

        // 若已經有 renderer 了，也視為就緒
        if (sceneEl.renderer) done('renderer-exists');

        // 超時保險
        setTimeout(()=>done('timeout'), timeoutMs);
      });
    }

    // === 穩健啟動 MindAR：輪詢檢查 system 是否就緒 & 可呼叫 start ===
    async function robustStartMindAR(maxTries = 30, intervalMs = 200){
      for (let i=1; i<=maxTries; i++){
        const sys = sceneEl.systems && sceneEl.systems['mindar-image-system'];
        if (sys && typeof sys.start === 'function'){
          try {
            sys.start();
            log(`✅ 已呼叫 mindar-image-system.start()（第 ${i} 次嘗試）`);
            return;
          } catch (e){
            log(`⚠️ start() 仍失敗（第 ${i} 次）：${e.message||e}`);
          }
        } else {
          log(`… 等待 mindar-image-system 就緒（第 ${i} 次）`);
        }
        await new Promise(r=>setTimeout(r, intervalMs));
      }
      // 最後備援：切 autoStart:true
      log('⚠️ 長時間無法 start，切換 autoStart:true 嘗試自動啟動');
      const old = sceneEl.getAttribute('mindar-image') || '';
      sceneEl.setAttribute('mindar-image', (old + '; autoStart: true;').replace(';;',';'));
    }

    // 手勢先解鎖相機
    async function unlockCameraOnce(){
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('此瀏覽器不支援相機 API');
      }
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
      stream.getTracks().forEach(t=>t.stop());
    }

    startBtn.addEventListener('click', async ()=>{
      try{
        log('👉 「開始體驗」按鈕被點擊');
        await unlockCameraOnce();
        log('✅ 相機權限就緒，等待 renderer…');
        await waitRendererReady();         // 取代原本只等 renderstart 的作法
        log('✅ renderer OK，啟動 MindAR 中…');
        await robustStartMindAR();         // 逐步重試 start()
        log('✅ start() 已呼叫，等待 arReady…');
      }catch(e){
        log('❌ 啟動流程失敗：'+(e.message||e));
        retryBtn.style.display='inline-block';
      }
    });

    retryBtn.addEventListener('click', ()=>location.reload());
  });
</script>
