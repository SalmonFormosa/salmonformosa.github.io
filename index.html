<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- 引入 GIF Shader -->
    <script src="https://cdn.jsdelivr.net/gh/etiennepinchon/aframe-gif-shader/dist/aframe-gif-shader.min.js"></script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
      embedded
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
    >
      <a-assets>
        <!-- 五張 GIF -->
        <img id="anim1" src="./drawing1.gif">
        <img id="anim2" src="./drawing2.gif">
        <img id="anim3" src="./drawing3.gif">
        <img id="anim4" src="./drawing4.gif">
        <img id="anim5" src="./drawing5.gif">
      </a-assets>

      <!-- Target 1 -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane
          position="0 0 0"
          height="1"
          width="1"
          material="shader: gif; src: #anim1; transparent: true;"
        ></a-plane>
      </a-entity>

      <!-- Target 2 -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-plane
          position="0 0 0"
          height="1"
          width="1"
          material="shader: gif; src: #anim2; transparent: true;"
        ></a-plane>
      </a-entity>

      <!-- Target 3 -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-plane
          position="0 0 0"
          height="1"
          width="1"
          material="shader: gif; src: #anim3; transparent: true;"
        ></a-plane>
      </a-entity>

      <!-- Target 4 -->
      <a-entity mindar-image-target="targetIndex: 3">
        <a-plane
          position="0 0 0"
          height="1"
          width="1"
          material="shader: gif; src: #anim4; transparent: true;"
        ></a-plane>
      </a-entity>

      <!-- Target 5 -->
      <a-entity mindar-image-target="targetIndex: 4">
        <a-plane
          position="0 0 0"
          height="1"
          width="1"
          material="shader: gif; src: #anim5; transparent: true;"
        ></a-plane>
      </a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
  </body>
</html>
