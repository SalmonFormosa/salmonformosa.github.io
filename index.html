<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MindAR 相機測試</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/aframe/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }

      #loadingScreen {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: black; color: white;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999;
      }
      #statusText { margin-top: 15px; font-size: 14px; color: #aaa; }
      #startBtn, #retryBtn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }
      #retryBtn { display: none; }
    </style>
  </head>
  <body>
    <!-- Loading 畫面 -->
    <div id="loadingScreen">
      <div id="mainMessage">📂 載入中...</div>
      <div id="statusText">正在載入 targets.mind</div>
      <button id="startBtn">▶️ 開始體驗</button>
      <button id="retryBtn">🔄 重試</button>
    </div>

    <!-- A-Frame 場景 -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
      embedded
      color-space="sRGB"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane color="blue" height="1" width="1" position="0 0 0"></a-plane>
      </a-entity>
    </a-scene>

    <script>
      const mainMessage = document.getElementById("mainMessage");
      const statusText = document.getElementById("statusText");
      const startBtn = document.getElementById("startBtn");
      const retryBtn = document.getElementById("retryBtn");
      const sceneEl = document.querySelector("a-scene");

      function updateStatus(main, sub="") {
        mainMessage.innerText = main;
        statusText.innerText = sub;
        console.log("📢 狀態更新:", main, sub);
      }

      // 確認 targets.mind 是否可載入
      fetch("./targets.mind").then(res => {
        if (res.ok) {
          updateStatus("✅ 已載入目標檔案", "等待相機啟動");
        } else {
          updateStatus("⚠️ 無法載入 targets.mind", "請確認檔案是否存在");
        }
      }).catch(() => {
        updateStatus("❌ 載入 targets.mind 失敗", "請確認路徑是否正確");
      });

      // 場景載入完成
      sceneEl.addEventListener("loaded", () => {
        console.log("✅ A-Frame 場景已載入");
      });

      // MindAR 準備完成
      sceneEl.addEventListener("arReady", () => {
        console.log("🎉 AR 已準備完成");
        updateStatus("🎉 AR 已準備完成", "相機初始化完成");
        setTimeout(() => { document.getElementById("loadingScreen").style.display = "none"; }, 1000);
      });

      // MindAR 錯誤
      sceneEl.addEventListener("arError", (err) => {
        console.error("❌ AR 初始化失敗", err);
        updateStatus("❌ AR 初始化失敗", JSON.stringify(err));
        retryBtn.style.display = "inline-block";
      });

      // 相機錯誤偵測
      const cameraEl = document.querySelector("a-camera");
      cameraEl.addEventListener("camera-error", (e) => {
        console.error("❌ 相機錯誤詳細資訊", e.detail);
        updateStatus("❌ 無法啟動相機", "請檢查瀏覽器或權限");
        retryBtn.style.display = "inline-block";
      });

      // 開始按鈕
      startBtn.addEventListener("click", async () => {
        console.log("▶️ 開始體驗被點擊");
        updateStatus("🚀 啟動中...", "請允許使用相機");
        try {
          const mindarEl = sceneEl.components["mindar-image"];
          await mindarEl.start();
          console.log("✅ MindAR 啟動成功");
        } catch (err) {
          console.error("❌ MindAR 啟動失敗", err);
          updateStatus("❌ MindAR 啟動失敗", err.message || err);
          retryBtn.style.display = "inline-block";
        }
      });

      retryBtn.addEventListener("click", () => window.location.reload());
    </script>
  </body>
</html>
